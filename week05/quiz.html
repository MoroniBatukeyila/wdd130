<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz form</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>

    <main>
        <h1> Basic HTML and CSS quiz</h1>
        <form action="">
            <div class="container box">
                <label for="q1">1. What does the acronym CSS stand for?</label>
                <input type="text" name="q1" id="q1">
            </div>

            <div class="container  box">
                <label for="q2">2. How are Id and Class attribute selected in CSS?</label>
                <textarea name="q2" id="q2" rows="4"></textarea>
            </div>

            <div class="container box">
                <label for="q3">3. Which of the following is a valid CSS comment?</label>
                <select name="q3" id="q3">
                    <option value="" selected disabled>Choose one option...</option>
                    <option value="a">A.</option>
                    <option value="b">B.</option>
                </select>
            </div>

            <div class="container box">
                <label for="q4">4. What is the bottom margin selector?</label>
                <code>margin:10px 5px 15px</code>
                <input type="text" name="q4" id="q4">
            </div>
            <button type="submit">Submit Quiz</button>
        </form>

    </main>

</body>

</html>
