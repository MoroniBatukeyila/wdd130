<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>translator</title>
    <link rel="stylesheet" href="translator.css">
</head>

<body>
    <h1>All Languages Translator</h1>
    <div class="container">
        <h4>What do you want to translate?</h4>
        <div class="languages">
            <div class="language1">

                <select name="language1" id="language1">
                    <option value="" selected disabled>EN</option>
                    <option value="EN">English</option>
                    <option value="FR">French</option>
                    <option value="Pr">Portuguese</option>
                </select>

                <input type="text" id="language1" name="language1" placeholder="Enter here">

            </div>


            <div class="language2">

                <select name="language2" id="language2">
                    <option value="" selected disabled>FR</option>
                    <option value="EN">English</option>
                    <option value="FR">French</option>
                    <option value="Pr">Portuguese</option>
                </select>

                <input type="text" id="language1" name="language1" placeholder="Enter here">

            </div>


        </div>

        <div class="button">

            <button type="submit">Translate</button>
        </div>


    </div>
</body>

</html>
