<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram home page </title>
    <link rel="stylesheet" href="insta-homepage.css">
</head>

<body>
    <div class="container">

        <header>

            <nav>

                <h2>
                    <a href="#">

            <img src="images/QR Serve Icon Dynamic Tray Signal.png" alt="profile picture"

            <div class="pre-bio">

                </div>
                <div class="Followers">

            <p>Bio...</p>


            <div class="profile">

                <div class="message">Message</div>

            </div>


            <div class="cercles">

                <div class="cercle1">
                    <img src="images/small image.webp" alt="first pic" width="200px" height="100px">

                <div class="cercle2">

                </div>

                <div class="cercle3">

                </div>

                <div class="cercle4">
                    <img src="images/WIN_20260821_19_15_46_Pro.jpg" alt="first pic" width="200px"
                      height="100px">
                    <h5>Caption</h5>
                </div>
            </div>


        </header>


        <main>

            <div class="icons">
                <div class="icon1">
                    <svg>...grid icon...</svg>
                </div>
                <div class="icon2"> <svg>...reels icon...</svg></div>
                <div class="icon3"> <svg>...tagged icon...</svg></div>
                <div class="icon4"> <svg>...profile icon...</svg></div>
            </div>


            <div class="Pictures">
                <div class="pict1">📌</div>
                <div class="pict2">📌</div>
                <div class="pict3">📌</div>


            </div>
