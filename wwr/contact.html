<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="author" content="Moroni Kalala Batukeyila">
    <meta name="description"
      content="Learn about Rapids, our history, mission, and passion for creating unforgettable white water rafting adventures.">

    <title>Rapids</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>

        <img src="images/wwrlogo.jpeg" alt="Rapids rafting company logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>

    </header>

    <main>

        <div class="info">

            <h1>Rapids Rafting Company</h1>

            <p>Bastasi bb, Foča 73300<br>Bosnia <br> +243 985 291 925 <br>office@raftingtara.com</p>


            <div class="company">
                <div class="map">
                    <iframe
                      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2564.274288769669!2d18.79328227555273!3d43.36893517077074!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x134cd5f1df4e20f3%3A0x1bb887a729f33b87!2sRafting%20Centar%20Drina-Tara!5e1!3m2!1sen!2scd!4v1791030202096!5m2!1sen!2scd"
                      allowfullscreen="" loading="lazy"
                      referrerpolicy="strict-origin-when-cross-origin" }></iframe>

                </div>
                <div class="form">
                    <form action="#">

                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Name">

                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Email">

                        <label>Message Purpose</label>

                        <div class="purpose">
                            <div>
                                <input type="radio" id="general" name="purpose" value="general">
                                <label for="general">General Inquiry</label>
                            </div>

                            <div>
                                <input type="radio" id="reservation" name="purpose"
                                  value="reservation">
                                <label for="reservation">Reservation Question</label>
                            </div>

                            <div>
                                <input type="radio" id="website" name="purpose" value="website">
                                <label for="website">Website Suggestion</label>
                            </div>
                        </div>

                        <div class="message">
                            <label for="message">Message</label>
                            <textarea id="message" name="message"
                              placeholder="Type here"></textarea>

                            <div class="check">
                                <input type="checkbox" id="sub" name="sub">
                                <label for="sub">Please subscribe me to the monthly
                                    newsletter</label>
                            </div>


                            <button type="submit">Get in Touch!</button>
                        </div>


                    </form>
                </div>
            </div>
        </div>

        <div class="employees">
            <h2 class="contact">We Are Here to Serve You</h2>

            <section class="team-container">

                <figure class="team-member">
                    <img src="images/raft employee2.jpeg" alt="Employee1">
                    <figcaption>Marcus</figcaption>
                </figure>

                <figure class="team-member">
                    <img src="images/raftemployee.jpg" alt="Employee2">
                    <figcaption>Jeff</figcaption>
                </figure>

                <figure class="team-member">
                    <img src="images/raftemployee3.jpg" alt="Employee3">
                    <figcaption>Grace</figcaption>
                </figure>
            </section>
        </div>
    </main>

    <footer>

        <p>©2026Rapids, Moroni Kalala Batukeyila</p>

        <nav class="socialmedia">

            <a href="https://facebook.com">
                <img src="images/facebooklogo.webp" alt="Facebooklogo">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedinlogo.webp" alt="LinkedInlogo">
            </a>

            <a href="https://instagram.com">
                <img src="images/instalogo.webp" alt="Instagramlogo">
            </a>

        </nav>

    </footer>

</body>

</html>
